services:
    fleet-postgres:
        image: postgis/postgis:16-3.4
        container_name: fleet-postgres
        restart: always
        environment:
            POSTGRES_DB: fleet_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgrespassword
        ports:
            - "5432:5432"
        volumes:
            - postgres_fleet_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d fleet_db"]
            interval: 10s
            timeout: 5s
            retries: 5

    fleet-redis:
        image: redis:7.2-alpine
        container_name: fleet-redis
        restart: always
        ports:
            - "6379:6379"
        volumes:
            - redis_fleet_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    fleet-rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: fleet-rabbitmq
        restart: always
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_fleet_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_fleet_data:
    redis_fleet_data:
    rabbitmq_fleet_data:
