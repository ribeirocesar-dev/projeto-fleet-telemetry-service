spring:
    application:
        name: fleet-telemetry-service

    datasource:
        url: jdbc:postgresql://localhost:5432/fleet_db
        username: postgres
        password: postgrespassword
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

    data:
        redis:
            host: localhost
            port: 6379
            timeout: 2000ms

    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest
        listener:
            simple:
                concurrency: 3
                max-concurrency: 10
                acknowledge-mode: auto

    jackson:
        draw-dates-as-timestamps: false

fleet:
    simulation:
        enabled: true
        interval-ms: 1000
    geofence:
        center-latitude: -23.550520
        center-longitude: -46.633308
        radius-km: 5.0

logging:
    level:
        root: INFO
        com.fleet.telemetry: DEBUG
        org.springframework.web.socket: INFO
        org.springframework.amqp: INFO
